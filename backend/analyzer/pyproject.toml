[project]
name = "loom-analyzer"
version = "0.1.0"
description = "FastAPI service for Loom AI code understanding"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.4",
  "uvicorn[standard]==0.32.0",
  "pydantic==2.9.2",
  "httpx==0.27.2",
  "python-dotenv==1.0.1"
]

[project.optional-dependencies]
dev = ["ruff==0.7.0", "pytest==8.3.3"]

[tool.ruff]
line-length = 100
target-version = "py311"

