version: '3.8'

services:
  # 1. Database (PostgreSQL)
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loom_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-loom_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - loom-network

  # 2. Redis (Queue)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - loom-network

  # 3. Backend Gateway (Node.js)
  gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-loom}:${POSTGRES_PASSWORD:-loom_dev_password}@db:5432/${POSTGRES_DB:-loom_db}
      REDIS_URL: redis://redis:6379
      ANALYZER_URL: http://analyzer:8000
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-123}
      CORS_ORIGIN: "http://localhost:3000"
    depends_on:
      - db
      - redis
      - analyzer
    networks:
      - loom-network

  # 4. Backend Analyzer (Python/FastAPI)
  analyzer:
    build:
      context: ./backend/analyzer
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
    networks:
      - loom-network

  # 5. Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_WS_URL: ws://localhost:4000/ws
    depends_on:
      - gateway
      - analyzer
    networks:
      - loom-network

networks:
  loom-network:
    driver: bridge

volumes:
  postgres_data:
